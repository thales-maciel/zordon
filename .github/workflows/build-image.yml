name: build-image

# Builds the linux/amd64 image (binaries + model generated in-build from the
# committed references.json.gz) and pushes it to GHCR. Replaces the manual
# `make image` + `docker push` flow.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tools/**"
      - "build.zig"
      - "build.zig.zon"
      - "Dockerfile"
      - "data/resources/references.json.gz"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/thales-maciel/zordon

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
