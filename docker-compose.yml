services:
  nginx:
    image: nginx:1.27-alpine
    container_name: zordon-nginx
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "16MB"

  api1:
    build: .
    image: ghcr.io/thalesmaciel/zordon:local
    container_name: zordon-api1
    environment:
      PORT: "8080"
      ZORDON_MODEL_PATH: "/app/model/references.i16.bin"
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "167MB"

  api2:
    build: .
    image: ghcr.io/thalesmaciel/zordon:local
    container_name: zordon-api2
    environment:
      PORT: "8080"
      ZORDON_MODEL_PATH: "/app/model/references.i16.bin"
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "167MB"
